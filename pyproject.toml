[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pollenradar"
version = "0.1.0"
description = "Pollen-Daten laden, analysieren und visualisieren"
requires-python = ">=3.10"
dependencies = ["pandas>=2.0", "matplotlib>=3.7", "requests>=2.31"]

[project.scripts]
pollenradar = "pollenradar.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
