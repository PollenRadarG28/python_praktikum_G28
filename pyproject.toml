
[project]
name = "pollenradar-analytics"
version = "0.1.0"
description = "Python Data Science project for pollen data analysis and visualization"
requires-python = ">=3.13,<3.14"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]


[tool.ruff]
target-version = "py313"
src = ["src"]

[tool.ruff.lint]
select = [
    "E4",   # Import- und Syntaxprobleme
    "E7",   # Unnötige Anweisungen und Formatierungsprobleme
    "E9",   # Schwerwiegende Syntaxfehler
    "F",    # Pyflakes: ungenutzte Variablen, Imports usw.
    "I",    # Imports sortieren
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-ra"
